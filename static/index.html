<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Central</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --text: #1c1c1e; --muted: #6c6c72; --line: #e3e3de;
  --accent: #0a62d8; --fresh: #c2410c; --chip: #ecece8; --on: #1c1c1e; --on-text: #ffffff;
  --warn: #a15c07; --ok: #2b7a3b; --star: #e0a100;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214; --panel: #191a1d; --text: #e9e9ec; --muted: #9b9ba3; --line: #2a2b30;
    --accent: #5ea3ff; --fresh: #ff8a4c; --chip: #232428; --on: #e9e9ec; --on-text: #111214;
    --warn: #f0a83a; --ok: #5fcf73; --star: #ffc93c;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0; }
.brand { font-weight: 700; font-size: 16px; margin-right: 4px; }
.status { color: var(--muted); font-size: 13px; flex: 1; min-width: 160px; }
.btn { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.btn.on { background: var(--on); color: var(--on-text); border-color: var(--on); }
.filters { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 3px 11px;
  font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--on); color: var(--on-text); }
.chip .n { opacity: .6; margin-left: 5px; font-size: 12px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1; min-width: 220px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); }
main { padding-top: 6px; padding-bottom: 80px; }
.banner { display: none; margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: var(--accent);
  color: #fff; cursor: pointer; text-align: center; font-size: 14px; font-weight: 600; }
.item { display: grid; grid-template-columns: 58px 1fr 30px; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.time { color: var(--muted); font-size: 12px; line-height: 1.3; padding-top: 2px; font-variant-numeric: tabular-nums; }
.time .ago { display: block; }
.item.fresh .time .ago { color: var(--fresh); font-weight: 700; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meta .src { color: var(--text); font-weight: 600; cursor: pointer; }
.meta .src:hover { text-decoration: underline; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .3px; }
.tag.state { border-color: var(--warn); color: var(--warn); }
.tag.an { border-color: var(--accent); color: var(--accent); }
.meta a { color: var(--accent); text-decoration: none; }
.title { display: block; color: var(--text); text-decoration: none; font-weight: 600; font-size: 15.5px; margin: 2px 0 1px; }
.title:hover { text-decoration: underline; }
.title:visited { color: var(--muted); }
.sum { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; cursor: pointer; }
.sum.open { -webkit-line-clamp: unset; display: block; }
.star { background: none; border: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 0; align-self: start; }
.star.on { color: var(--star); }
.more { margin: 18px auto; display: flex; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 6px; font-size: 14px; }
.saved-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.saved-item.done { opacity: .55; }
.saved-item textarea { width: 100%; min-height: 56px; margin-top: 8px; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); font-size: 13.5px; line-height: 1.4; resize: vertical; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.detail { color: var(--muted); word-break: break-all; font-size: 12px; }
.st-ok { color: var(--ok); } .st-discovered { color: var(--accent); } .st-error { color: var(--warn); } .st-pending { color: var(--muted); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--on); color: var(--on-text);
  padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; }
@media (max-width: 600px) {
  .item { grid-template-columns: 46px 1fr 26px; gap: 8px; }
  .title { font-size: 15px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <span class="brand">News Central</span>
      <span class="status" id="status">Connecting…</span>
      <button class="btn on" data-view="feed" id="v-feed">Feed</button>
      <button class="btn" data-view="saved" id="v-saved">Saved <span id="saved-n"></span></button>
      <button class="btn" data-view="sources" id="v-sources">Sources</button>
      <button class="btn" id="refresh" title="Fetch every source now (shortcut: r)">Refresh</button>
    </div>
    <div class="filters" id="filters">
      <div class="chips" id="regions"></div>
      <div class="row">
        <input class="search" id="q" type="search" placeholder="Search titles, summaries, outlets  ( / )" autocomplete="off">
        <select class="btn" id="win">
          <option value="1">Last hour</option>
          <option value="6">Last 6 h</option>
          <option value="24">Last 24 h</option>
          <option value="72">Last 3 days</option>
        </select>
        <select class="btn" id="kind">
          <option value="all">News + analysis</option>
          <option value="news">News only</option>
          <option value="analysis">Analysis only</option>
        </select>
        <label class="btn"><input type="checkbox" id="hidesports"> Hide sports &amp; celebrity</label>
        <label class="btn"><input type="checkbox" id="hidestate"> Hide state-controlled</label>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="banner" id="banner"></div>
  <section id="feed"></section>
  <section id="saved" hidden></section>
  <section id="sources" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
'use strict';
const REGION_ORDER = ['Spain', 'Europe & EU', 'Eurasia', 'Middle East & N. Africa', 'Africa', 'Latin America',
  'North America', 'South Asia', 'East Asia', 'Southeast Asia', 'Oceania', 'Global'];
const PAGE = 150;
// Section names in article URLs that mark sports and celebrity coverage (culture, music and film stay in).
const SPORT_RE = /\/(?:sports?|deportes?|esportes?|futbol|football|soccer|nfl|nba|mlb|tenis|tennis|golf|f1|formula-?1|cricket|rugby|boxeo|boxing|ufc|motorsport|celebrit(?:y|ies)|famosos|farandula|espectaculos|teleshow|showbiz|gente|horoscopos?|horoscopes?|loterias?|lottery|k-?pop)(?:\/|-|\.|$)/;
function isSportOrCeleb(link) {
  try { return SPORT_RE.test(new URL(link).pathname.toLowerCase()); } catch (e) { return false; }
}
const $ = (sel) => document.querySelector(sel);

const pref = {
  get(k, d) { try { const v = localStorage.getItem('nc.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nc.' + k, JSON.stringify(v)); } catch (e) {} }
};

const S = {
  items: new Map(), sources: {}, sourceList: [], saved: new Map(),
  region: pref.get('region', 'All'), win: pref.get('win', 24), kind: pref.get('kind', 'all'),
  hideState: pref.get('hideState', false), hideSports: pref.get('hideSports', true), showDigested: pref.get('showDigested', false),
  q: '', src: '', shown: PAGE, cutoff: 0, maxSeen: 0, view: 'feed',
  running: false, updated: 0, sourcesError: '', booting: true, applyAfterRun: false, timer: null
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeHref(u) { return /^https?:\/\//i.test(u || '') ? esc(u) : '#'; }
function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2400);
}

async function getJSON(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-NewsCentral': '1' },
    body: JSON.stringify(body || {})
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ------------------------------------------------------------ data */

async function loadSources() {
  const d = await getJSON('/api/sources');
  S.sources = {};
  d.sources.forEach(s => { S.sources[s.id] = s; });
  S.sourceList = d.sources;
  S.running = d.running; S.updated = d.updated; S.sourcesError = d.sources_error;
}

async function loadItems() {
  const d = await getJSON('/api/items?since=' + S.maxSeen);
  let added = 0;
  for (const it of d.items) {
    if (S.items.has(it.id)) continue;
    const src = S.sources[it.s];
    it._sport = isSportOrCeleb(it.link);
    it._text = norm(it.title + ' ' + (it.summary || '') + ' ' + (src ? src.name + ' ' + (src.country || '') : ''));
    S.items.set(it.id, it);
    if (it.fs > S.maxSeen) S.maxSeen = it.fs;
    added++;
  }
  S.running = d.running; S.updated = d.updated;
  const minT = Date.now() / 1000 - 96 * 3600;
  for (const [id, it] of S.items) if (it.t < minT && it.fs < minT) S.items.delete(id);
  return added;
}

async function loadSaved() {
  const d = await getJSON('/api/saved');
  S.saved = new Map(d.saved.map(x => [x.id, x]));
  updateSavedCount();
}
function updateSavedCount() { $('#saved-n').textContent = S.saved.size ? '(' + S.saved.size + ')' : ''; }

function regionsPresent() {
  const set = new Set(S.sourceList.map(s => s.region));
  const out = REGION_ORDER.filter(r => set.has(r));
  set.forEach(r => { if (out.indexOf(r) === -1) out.push(r); });
  return out;
}

function compute() {
  const minT = Date.now() / 1000 - S.win * 3600;
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  const shown = [], counts = {};
  let total = 0, pending = 0;
  for (const it of S.items.values()) {
    const src = S.sources[it.s];
    if (!src || it.t < minT) continue;
    if (S.kind !== 'all' && (src.kind || 'news') !== S.kind) continue;
    if (S.hideState && src.state_media) continue;
    if (S.hideSports && it._sport) continue;
    if (S.src && it.s !== S.src) continue;
    let ok = true;
    for (let i = 0; i < terms.length; i++) if (it._text.indexOf(terms[i]) === -1) { ok = false; break; }
    if (!ok) continue;
    const inRegion = S.region === 'All' || src.region === S.region;
    if (it.fs > S.cutoff) { if (inRegion) pending++; continue; }
    counts[src.region] = (counts[src.region] || 0) + 1;
    total++;
    if (inRegion) shown.push(it);
  }
  shown.sort((a, b) => b.t - a.t);
  return { shown, counts, total, pending };
}

/* ------------------------------------------------------------ rendering */

function renderStatus() {
  if (S.sourcesError) { $('#status').textContent = S.sourcesError; return; }
  const L = S.sourceList;
  const ok = L.filter(s => s.status === 'ok' || s.status === 'discovered').length;
  let txt = ok + '/' + L.length + ' sources';
  if (S.updated) { const a = ago(S.updated); txt += ' · updated ' + (a === 'now' ? 'just now' : a + ' ago'); }
  if (S.running) txt += ' · fetching…';
  $('#status').textContent = txt;
}

function itemHTML(it, now) {
  const src = S.sources[it.s];
  const d = new Date(it.t * 1000);
  const sameDay = d.toDateString() === new Date().toDateString();
  const top = sameDay ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                      : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
  const tags = [];
  if (src.lang && src.lang !== 'en') tags.push('<span class="tag">' + esc(src.lang) + '</span>');
  if (src.kind === 'analysis') tags.push('<span class="tag an">analysis</span>');
  if (src.state_media) tags.push('<span class="tag state">state-controlled</span>');
  if (src.paywall) tags.push('<span class="tag">paywall</span>');
  if (src.lang && src.lang !== 'en' && src.lang !== 'es') {
    tags.push('<a href="https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(it.link) +
              '" target="_blank" rel="noopener">translate</a>');
  }
  const saved = S.saved.has(it.id);
  return '<article class="item' + (now - it.t < 3600 ? ' fresh' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="time">' + esc(top) + '<span class="ago">' + ago(it.t) + '</span></div>' +
    '<div><div class="meta"><span class="src" data-src="' + esc(it.s) + '" title="Show only this outlet">' + esc(src.name) +
    '</span><span>' + esc(src.country || '') + '</span>' + tags.join('') + '</div>' +
    '<a class="title" href="' + safeHref(it.link) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' +
    (it.summary ? '<div class="sum">' + esc(it.summary) + '</div>' : '') + '</div>' +
    '<button class="star' + (saved ? ' on' : '') + '" data-star="' + esc(it.id) + '" title="Save for later">' +
    (saved ? '★' : '☆') + '</button></article>';
}

function renderFeed(listToo) {
  const r = compute();
  const regs = ['All'].concat(regionsPresent());
  let chips = '';
  if (S.src && S.sources[S.src]) {
    chips += '<button class="chip on" data-clearsrc="1">Only ' + esc(S.sources[S.src].name) + ' ✕</button>';
  }
  chips += regs.map(g => '<button class="chip' + (S.region === g ? ' on' : '') + '" data-region="' + esc(g) + '">' +
    esc(g) + '<span class="n">' + (g === 'All' ? r.total : (r.counts[g] || 0)) + '</span></button>').join('');
  $('#regions').innerHTML = chips;

  const b = $('#banner');
  if (r.pending > 0 && S.view === 'feed') {
    b.textContent = r.pending + ' new item' + (r.pending > 1 ? 's' : '') + ' · show';
    b.style.display = 'block';
  } else {
    b.style.display = 'none';
  }
  document.title = (r.pending ? '(' + r.pending + ') ' : '') + 'News Central';
  if (listToo === false) return;

  const el = $('#feed');
  if (!r.shown.length) {
    let msg = 'Nothing matches these filters.';
    if (!S.items.size) msg = S.running ? 'Fetching every source for the first time. This takes a minute or two.'
                                       : 'No items yet. Press Refresh.';
    el.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }
  const now = Date.now() / 1000;
  let h = r.shown.slice(0, S.shown).map(it => itemHTML(it, now)).join('');
  if (r.shown.length > S.shown) h += '<button class="btn more" id="more">Show more (' + (r.shown.length - S.shown) + ' left)</button>';
  el.innerHTML = h;
}

function updateTimes() {
  const now = Date.now() / 1000;
  document.querySelectorAll('#feed .item').forEach(el => {
    const it = S.items.get(el.dataset.id);
    if (!it) return;
    el.querySelector('.ago').textContent = ago(it.t);
    el.classList.toggle('fresh', now - it.t < 3600);
  });
}

function renderSaved() {
  const all = Array.from(S.saved.values()).sort((a, b) => b.saved_at - a.saved_at);
  const list = S.showDigested ? all : all.filter(x => !x.digested);
  const open = all.filter(x => !x.digested).length;
  let h = '<div class="toolbar">' +
    '<button class="btn" id="copy-md">Copy for Claude (' + open + ' not digested)</button>' +
    '<a class="btn" href="/api/export.md?download=1">Download .md (all)</a>' +
    '<label class="btn"><input type="checkbox" id="show-dig"' + (S.showDigested ? ' checked' : '') + '> Show digested</label></div>';
  if (!list.length) {
    h += '<div class="empty">' + (all.length ? 'Everything saved is marked as digested.' : 'Nothing saved yet. Use ☆ on any item.') + '</div>';
  }
  h += list.map(x => '<div class="saved-item' + (x.digested ? ' done' : '') + '">' +
    '<div class="meta"><span class="src">' + esc(x.source_name) + '</span><span>' + esc(x.country || '') + '</span><span>' +
    esc(x.region || '') + '</span><span>' + (x.published ? esc(new Date(x.published * 1000).toLocaleString()) : '') + '</span></div>' +
    '<a class="title" href="' + safeHref(x.link) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a>' +
    (x.summary ? '<div class="sum open">' + esc(x.summary) + '</div>' : '') +
    '<textarea placeholder="Your note: why it matters, which motion or argument it feeds…" data-note="' + esc(x.id) + '">' +
    esc(x.note || '') + '</textarea>' +
    '<div class="toolbar"><label class="btn"><input type="checkbox" data-dig="' + esc(x.id) + '"' + (x.digested ? ' checked' : '') +
    '> Digested</label><button class="btn" data-unsave="' + esc(x.id) + '">Remove</button></div></div>').join('');
  $('#saved').innerHTML = h;
}

function renderSources() {
  const rank = { error: 0, pending: 1, discovered: 2, ok: 3 };
  const L = S.sourceList.slice().sort((a, b) =>
    (rank[a.status] - rank[b.status]) || a.region.localeCompare(b.region) || a.name.localeCompare(b.name));
  const c = { ok: 0, discovered: 0, error: 0, pending: 0 };
  L.forEach(s => { c[s.status] = (c[s.status] || 0) + 1; });
  const label = { ok: 'ok', discovered: 'auto-found', error: 'failing', pending: 'not fetched yet' };
  let h = '<div class="toolbar">' + c.ok + ' ok · ' + c.discovered + ' auto-found · ' + c.error + ' failing' +
    (c.pending ? ' · ' + c.pending + ' not fetched yet' : '') + '</div>';
  h += '<table><thead><tr><th>Source</th><th>Region</th><th>Status</th><th>Items</th><th>Last OK</th><th>Detail</th></tr></thead><tbody>';
  h += L.map(s => '<tr><td>' + esc(s.name) + '<div class="meta">' + esc(s.country || '') + ' · ' + esc(s.lang || '') + '</div></td>' +
    '<td>' + esc(s.region) + '</td><td class="st-' + s.status + '">' + label[s.status] + '</td><td>' + (s.count || 0) + '</td>' +
    '<td>' + (s.last_ok ? (ago(s.last_ok) === 'now' ? 'just now' : ago(s.last_ok) + ' ago') : 'never') + '</td>' +
    '<td class="detail">' + esc(s.status === 'error' ? s.error : s.feed) + '</td></tr>').join('');
  $('#sources').innerHTML = h + '</tbody></table>';
}

function setView(v) {
  S.view = v;
  ['feed', 'saved', 'sources'].forEach(x => {
    $('#' + x).hidden = x !== v;
    $('#v-' + x).classList.toggle('on', x === v);
  });
  $('#filters').hidden = v !== 'feed';
  $('#banner').style.display = 'none';
  if (v === 'feed') renderFeed();
  if (v === 'saved') loadSaved().then(renderSaved).catch(() => toast('Server not reachable'));
  if (v === 'sources') renderSources();
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------ polling */

async function tick() {
  clearTimeout(S.timer);
  const wasRunning = S.running;
  try {
    await loadSources();
    const added = await loadItems();
    let applied = false;
    if (S.booting || (S.applyAfterRun && wasRunning && !S.running)) {
      S.cutoff = S.maxSeen;
      applied = true;
      if (!S.running) { S.booting = false; S.applyAfterRun = false; }
    }
    renderStatus();
    if (S.view === 'feed') {
      if (applied) renderFeed();
      else if (added) renderFeed(false);
      updateTimes();
    } else if (S.view === 'sources') {
      renderSources();
    }
  } catch (e) {
    $('#status').textContent = 'Cannot reach the News Central server. Is its Terminal window still open?';
  }
  S.timer = setTimeout(tick, S.running ? 4000 : 60000);
}

async function copyMd() {
  try {
    const r = await fetch('/api/export.md?only=undigested', { cache: 'no-store' });
    const txt = await r.text();
    try {
      await navigator.clipboard.writeText(txt);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('Copied. Paste it into a chat with Claude.');
  } catch (e) {
    toast('Could not copy: ' + e.message);
  }
}

async function toggleSave(id, btn) {
  const on = S.saved.has(id);
  try {
    await post(on ? '/api/unsave' : '/api/save', { id: id });
    if (on) S.saved.delete(id); else S.saved.set(id, { id: id });
    btn.classList.toggle('on', !on);
    btn.textContent = on ? '☆' : '★';
    updateSavedCount();
    if (!on) toast('Saved for later');
  } catch (e) {
    toast('Could not save: ' + e.message);
  }
}

/* ------------------------------------------------------------ events */

document.addEventListener('click', async (e) => {
  const t = e.target;
  const view = t.closest('[data-view]');
  if (view) { setView(view.dataset.view); return; }
  if (t.closest('#refresh')) {
    try {
      const r = await post('/api/refresh');
      toast(r.started ? 'Fetching every source now…' : 'A fetch is already running…');
      S.running = true; S.applyAfterRun = true;
      renderStatus();
      clearTimeout(S.timer);
      S.timer = setTimeout(tick, 2000);
    } catch (err) { toast('Server not reachable'); }
    return;
  }
  const chip = t.closest('[data-region]');
  if (chip) { S.region = chip.dataset.region; pref.set('region', S.region); S.shown = PAGE; renderFeed(); window.scrollTo(0, 0); return; }
  if (t.closest('[data-clearsrc]')) { S.src = ''; S.shown = PAGE; renderFeed(); return; }
  const src = t.closest('#feed [data-src]');
  if (src) { S.src = src.dataset.src; S.shown = PAGE; renderFeed(); window.scrollTo(0, 0); return; }
  if (t.closest('#more')) { S.shown += PAGE; renderFeed(); return; }
  if (t.closest('#banner')) { S.cutoff = S.maxSeen; S.shown = PAGE; renderFeed(); window.scrollTo(0, 0); return; }
  const star = t.closest('[data-star]');
  if (star) { toggleSave(star.dataset.star, star); return; }
  const sum = t.closest('#feed .sum');
  if (sum) { sum.classList.toggle('open'); return; }
  if (t.closest('#copy-md')) { copyMd(); return; }
  const un = t.closest('[data-unsave]');
  if (un) {
    try { await post('/api/unsave', { id: un.dataset.unsave }); await loadSaved(); renderSaved(); }
    catch (err) { toast('Server not reachable'); }
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'win') { S.win = +t.value; pref.set('win', S.win); S.shown = PAGE; renderFeed(); }
  else if (t.id === 'kind') { S.kind = t.value; pref.set('kind', S.kind); S.shown = PAGE; renderFeed(); }
  else if (t.id === 'hidesports') { S.hideSports = t.checked; pref.set('hideSports', S.hideSports); S.shown = PAGE; renderFeed(); }
  else if (t.id === 'hidestate') { S.hideState = t.checked; pref.set('hideState', S.hideState); S.shown = PAGE; renderFeed(); }
  else if (t.id === 'show-dig') { S.showDigested = t.checked; pref.set('showDigested', S.showDigested); renderSaved(); }
  else if (t.dataset && t.dataset.dig) {
    const id = t.dataset.dig;
    try {
      await post('/api/saved/update', { id: id, digested: t.checked });
      const x = S.saved.get(id);
      if (x) x.digested = t.checked ? 1 : 0;
      renderSaved();
    } catch (err) { toast('Server not reachable'); }
  }
});

let qTimer = null;
const noteTimers = {};
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { S.q = t.value; S.shown = PAGE; renderFeed(); }, 150);
  } else if (t.dataset && t.dataset.note) {
    const id = t.dataset.note;
    clearTimeout(noteTimers[id]);
    noteTimers[id] = setTimeout(async () => {
      try {
        await post('/api/saved/update', { id: id, note: t.value });
        const x = S.saved.get(id);
        if (x) x.note = t.value;
      } catch (err) { toast('Note not saved: server not reachable'); }
    }, 600);
  }
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (e.key === 'Escape' && e.target.id === 'q') { e.target.value = ''; S.q = ''; renderFeed(); e.target.blur(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); if (S.view !== 'feed') setView('feed'); $('#q').focus(); }
  else if (e.key === 'r') { $('#refresh').click(); }
});

/* ------------------------------------------------------------ start */

$('#win').value = String(S.win);
$('#kind').value = S.kind;
$('#hidestate').checked = S.hideState;
$('#hidesports').checked = S.hideSports;
loadSaved().catch(() => {}).then(tick);
</script>
</body>
</html>
